version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
    volumes:
      - ./fraud_analytics.db:/app/backend/fraud_analytics.db

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  producer:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python kafka_service/producer.py
    depends_on:
      - backend